services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local_password
      POSTGRES_DB: messaging
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - ./DockerData/postgres:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d messaging"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - ./DockerData/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgres://app:local_password@db:5432/messaging
      REDIS_URL: redis://redis:6379
      OTP_SECRET: development-only-change-this-secret
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: development
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
